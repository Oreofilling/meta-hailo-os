# Persistent journal policy for systems whose /var/log is backed by /data.
[Journal]
Storage=persistent

# Bound persistent storage so logging cannot exhaust the data partition.
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=7day

# Bound the early-boot runtime journal before /var/log becomes available.
RuntimeMaxUse=8M
RuntimeMaxFileSize=2M

RateLimitIntervalSec=10s
RateLimitBurst=200

ForwardToSyslog=yes
MaxLevelSyslog=err
ForwardToKMsg=no
MaxLevelConsole=warning
Compress=yes
