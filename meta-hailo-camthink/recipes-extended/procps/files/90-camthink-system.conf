# Reboot after a kernel panic or oops instead of remaining unavailable.
kernel.panic = 10
kernel.panic_on_oops = 1
kernel.panic_on_rcu_stall = 1

# Keep serial-console emergency diagnostics available.
kernel.sysrq = 1

# Process dumps live on the persistent partition and are pruned by the
# camthink-core-prune timer.
kernel.core_pattern = /data/core/core.%e.%p.%t
