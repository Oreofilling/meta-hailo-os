header:
  version: 11

# DDR: edit DDR_PROFILE below (see meta-hailo-camthink/conf/machine/include/ddr-profile.inc).
local_conf_header:
  ddr-profile: |
    DDR_PROFILE = "h9hcnnncpumlxr-4g-lp4"
  persistent-system-logs: |
    # Keep /var/log as a real rootfs directory. The product fstab bind mounts
    # it from /data/log so journals and login records survive reboot and A/B
    # rootfs replacement.
    VOLATILE_LOG_DIR = "no"

repos:
  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    commit: c474ae21b11a816be607eb7b44d2cf77d1125bce
    layers:
      .:

  meta-hailo-camthink:
    path: meta-hailo-camthink
    layers:
      .:
